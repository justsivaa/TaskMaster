<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Task Master logo. Edit the colours here, then re-export build/icon.png, build/icon.ico, src/icon.png and src/renderer/logo.png -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a1440"/><stop offset=".5" stop-color="#0c0a22"/><stop offset="1" stop-color="#030209"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".42" r=".5">
      <stop offset="0" stop-color="#6d4dff" stop-opacity=".38"/><stop offset="1" stop-color="#6d4dff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ring" gradientUnits="userSpaceOnUse" x1="260" y1="240" x2="780" y2="800">
      <stop offset="0" stop-color="#2be0ff"/><stop offset=".4" stop-color="#7a5cff"/><stop offset=".75" stop-color="#ff3fa4"/><stop offset="1" stop-color="#ff8a3d"/>
    </linearGradient>
    <linearGradient id="tick" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#c9bcff"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".16"/><stop offset=".35" stop-color="#fff" stop-opacity="0"/></linearGradient>
  </defs>
  <rect width="1024" height="1024" rx="232" fill="url(#bg)"/>
  <rect width="1024" height="1024" rx="232" fill="url(#glow)"/>
  <!-- ring with a gap at the top right, the check leaves through it -->
  <path d="M722 276 A260 260 0 1 0 770 560" fill="none" stroke="url(#ring)" stroke-width="64" stroke-linecap="round"/>
  <path d="M396 520 L492 616 L780 300" fill="none" stroke="url(#tick)" stroke-width="84" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="3" y="3" width="1018" height="1018" rx="229" fill="none" stroke="url(#rim)" stroke-width="6"/>
</svg>
